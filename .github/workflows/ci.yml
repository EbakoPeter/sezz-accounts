name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default; individual jobs opt into more (e.g. CodeQL's
# own security-events: write) only where actually needed.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, typecheck, test, build, PWA verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: PWA installability verify
        run: npm run verify:pwa
